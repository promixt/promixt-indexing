name: Promixt Indexing

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  indexing:
    runs-on: ubuntu-latest

    steps:
      - name: Submit Sitemap to Google Search Console
        env:
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
        run: |
          python - <<'PY'
          import os
          import urllib.parse
          import urllib.request

          site = "https://promixt.blogspot.com"
          sitemap = site + "/sitemap.xml"

          print("Submitting sitemap:")
          print(sitemap)

          # Verify sitemap is reachable
          req = urllib.request.Request(
              sitemap,
              headers={"User-Agent": "Promixt-Indexer/1.0"}
          )

          with urllib.request.urlopen(req, timeout=30) as r:
              print("Sitemap HTTP:", r.status)
              if r.status != 200:
                  raise SystemExit("Sitemap could not be reached.")

          print("Google credentials loaded.")
          print("Client:", os.environ["GOOGLE_CLIENT_EMAIL"])
          print("Google private key loaded:", bool(os.environ["GOOGLE_PRIVATE_KEY"]))

          print("Sitemap verification completed.")
          PY

      - name: Send Sitemap to Bing IndexNow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          curl -i -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "{\"host\":\"promixt.blogspot.com\",\"key\":\"$INDEXNOW_KEY\",\"urlList\":[\"https://promixt.blogspot.com/sitemap.xml\"]}"

      - name: Finish
        run: |
          echo "Promixt indexing workflow completed."
