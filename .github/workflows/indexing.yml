name: Promixt Google Indexing

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  indexing:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Install dependencies
      # ==========================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-auth requests

      # ==========================================
      # 2. Submit sitemap to Google Search Console
      # ==========================================
      - name: Submit Sitemap to Google Search Console
        env:
          GOOGLE_PROJECT_ID: ${{ secrets.GOOGLE_PROJECT_ID }}
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests
          from urllib.parse import quote
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          SITE = "https://promixt.blogspot.com/"
          SITEMAP = "https://promixt.blogspot.com/sitemap.xml"

          print("==========================================")
          print("GOOGLE SEARCH CONSOLE")
          print("==========================================")
          print("Site:", SITE)
          print("Sitemap:", SITEMAP)

          # --------------------------------------
          # Create Google service-account credentials
          # --------------------------------------
          private_key = os.environ["GOOGLE_PRIVATE_KEY"]

          # Handle escaped newlines safely
          private_key = private_key.replace("\\n", "\n")

          info = {
              "type": "service_account",
              "project_id": os.environ["GOOGLE_PROJECT_ID"],
              "private_key": private_key,
              "client_email": os.environ["GOOGLE_CLIENT_EMAIL"],
              "token_uri": "https://oauth2.googleapis.com/token"
          }

          credentials = service_account.Credentials.from_service_account_info(
              info,
              scopes=[
                  "https://www.googleapis.com/auth/webmasters"
              ]
          )

          # --------------------------------------
          # Authenticate
          # --------------------------------------
          credentials.refresh(Request())

          print("Authentication: OK")
          print("Service account:", os.environ["GOOGLE_CLIENT_EMAIL"])

          # --------------------------------------
          # Google Search Console Sitemaps API
          # --------------------------------------
          endpoint = (
              "https://www.googleapis.com/webmasters/v3/sites/"
              + quote(SITE, safe="")
              + "/sitemaps/"
              + quote(SITEMAP, safe="")
          )

          response = requests.put(
              endpoint,
              headers={
                  "Authorization": "Bearer " + credentials.token
              },
              timeout=60
          )

          print("Google API HTTP:", response.status_code)

          if response.status_code not in (200, 204):
              print("Google response:")
              print(response.text)

              raise SystemExit(
                  "ERROR: Google Search Console sitemap submission failed."
              )

          print("")
          print("SUCCESS: Sitemap submitted to Google Search Console.")
          print("")

          # --------------------------------------
          # Verify sitemap
          # --------------------------------------
          verify = requests.get(
              endpoint,
              headers={
                  "Authorization": "Bearer " + credentials.token
              },
              timeout=60
          )

          print("Verification HTTP:", verify.status_code)

          if verify.status_code == 200:
              print("SUCCESS: Sitemap verification completed.")
              print(verify.text[:4000])
          else:
              print("Verification response:")
              print(verify.text)

          PY

      # ==========================================
      # 3. Read Blogger sitemap
      # ==========================================
      - name: Verify Blogger Sitemap
        run: |
          python - <<'PY'
          import requests
          import xml.etree.ElementTree as ET

          SITEMAP = "https://promixt.blogspot.com/sitemap.xml"

          print("==========================================")
          print("BLOGGER SITEMAP")
          print("==========================================")
          print("URL:", SITEMAP)

          response = requests.get(
              SITEMAP,
              headers={
                  "User-Agent": "Promixt-Google-Indexer/1.0"
              },
              timeout=60
          )

          print("Sitemap HTTP:", response.status_code)

          if response.status_code != 200:
              raise SystemExit(
                  "ERROR: Blogger sitemap could not be reached."
              )

          try:
              root = ET.fromstring(response.content)
              print("XML: Valid")
          except Exception as e:
              raise SystemExit(
                  "ERROR: Sitemap XML is invalid: " + str(e)
              )

          namespace = "{http://www.sitemaps.org/schemas/sitemap/0.9}"

          urls = []

          # Normal URL sitemap
          for loc in root.findall(
              ".//" + namespace + "url/" + namespace + "loc"
          ):
              if loc.text:
                  urls.append(loc.text.strip())

          # Sitemap index
          sitemap_children = []

          for loc in root.findall(
              ".//" + namespace + "sitemap/" + namespace + "loc"
          ):
              if loc.text:
                  sitemap_children.append(loc.text.strip())

          print("URLs directly in sitemap:", len(urls))
          print("Child sitemaps:", len(sitemap_children))

          print("")
          print("Blogger sitemap is reachable and valid.")
          print("")

          PY

      # ==========================================
      # 4. Finish
      # ==========================================
      - name: Finish
        run: |
          echo "=========================================="
          echo "PROMIXT GOOGLE INDEXING COMPLETED"
          echo "=========================================="
          echo "Google Search Console: Sitemap submitted"
          echo "Blogger Sitemap: Verified"
          echo "Bing/IndexNow: Skipped"
